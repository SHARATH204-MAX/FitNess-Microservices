    {
      "userId": "{{userId}}",
      "type": "RUNNING",
      "duration": 30,
      "caloriesBurned": 300,
      "startTime": "2026-12-12T10:00:00",
      "additionalMetrics": {
        "distance": 5.2,
        "averageSpeed": 10.4,
        "maxHeartRate": 165
      }
    }
order: 1000
